{% extends 'base.html' %}

{% block title %}Login - AnnoHID{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header text-center bg-primary text-white">
                <h4 class="mb-0">🔐 Login</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required
                               placeholder="Enter your username" autocomplete="username">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required
                               placeholder="Enter your password" autocomplete="current-password">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>

                <hr>

                <div class="text-center">
                    <h6 class="text-muted">Demo Credentials</h6>
                    <div class="row">
                        <div class="col-6">
                            <small class="text-muted">
                                <strong>Admin:</strong><br>
                                administrator / anohid123
                            </small>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">
                                <strong>Annotator:</strong><br>
                                annotator_22 / Rekmed123
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Auto-focus username field
    document.getElementById('username').focus();

    // Demo credential quick-fill buttons
    function fillCredentials(username, password) {
        document.getElementById('username').value = username;
        document.getElementById('password').value = password;
    }

    // Add click handlers for demo credentials
    document.addEventListener('DOMContentLoaded', function() {
        // Make demo credentials clickable
        const demoCredentials = document.querySelectorAll('.text-muted small');
        demoCredentials.forEach(function(element) {
            if (element.textContent.includes('administrator')) {
                element.style.cursor = 'pointer';
                element.onclick = function() { fillCredentials('administrator', 'anohid123'); };
            } else if (element.textContent.includes('annotator_22')) {
                element.style.cursor = 'pointer';
                element.onclick = function() { fillCredentials('annotator_22', 'Rekmed123'); };
            }
        });
    });
</script>
{% endblock %}
